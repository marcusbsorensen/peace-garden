# XcodeGen project definition.
#
#   brew install xcodegen && xcodegen generate
#
# The project file itself is deliberately not checked in: it is generated
# output, and it is the single worst file in an iOS repository to merge.
name: PeaceGarden
options:
  bundleIdPrefix: com.peacegarden
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SeedCore:
    path: Packages/SeedCore

targets:
  PeaceGarden:
    type: application
    platform: iOS
    sources:
      - path: App/PeaceGarden
    dependencies:
      - package: SeedCore
        product: SeedCore
    settings:
      base:
        PRODUCT_NAME: PeaceGarden
        PRODUCT_BUNDLE_IDENTIFIER: com.peacegarden.app
        INFOPLIST_FILE: App/PeaceGarden/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PeaceGarden/Resources/PeaceGarden.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

schemes:
  PeaceGarden:
    build:
      targets:
        PeaceGarden: all
    run:
      config: Debug
    test:
      config: Debug
