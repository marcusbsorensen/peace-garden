# The local stand-in for the 20i vhost: nginx in front of PHP-FPM, no Apache,
# no .htaccess. Server/README.md quotes the two location lines the host has;
# they are copied here as they are. Everything else is nginx's defaults.
#
# One addition, for the harness only: `X-Sim-Addr`. A simulated gardener sends
# the address their phone would have, and it reaches PHP as REMOTE_ADDR, so the
# rate limit (Limits.php, keyed on REMOTE_ADDR alone) sees thousands of callers
# rather than one. A request without the header is this Mac's own address, as
# the live host would see it.

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 4096; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format timed '$remote_addr "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time sim=$http_x_sim_addr';
    access_log /var/log/nginx/access.log timed buffer=64k flush=2s;

    map $http_x_sim_addr $sim_addr {
        default $http_x_sim_addr;
        ""      $remote_addr;
    }

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        root __SERVER_ROOT__;
        index index.php;

        # nginx's own dot rule, which keeps .api/ and .pages/ unreachable.
        location ~ /\.(?!well-known(?:/|$)) { deny all; }

        # The two lines Server/README.md quotes from the host.
        location / { try_files $uri $uri/ @dispatch; }
        location @dispatch { if (-f $document_root/index.php) { rewrite ^ /index.php last; } }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass __FPM__;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REMOTE_ADDR $sim_addr;
            fastcgi_read_timeout 60s;
        }
    }
}
