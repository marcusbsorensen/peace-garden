; PHP-FPM for the population test, on this Mac (Homebrew PHP), behind the
; nginx container. A fixed pool, because a shared host gives a site a fixed
; number of PHP processes rather than as many as it asks for.

[global]
pid = __SCRATCH__/php-fpm.pid
error_log = __SCRATCH__/php-fpm.log
daemonize = yes

[pop]
listen = 127.0.0.1:__FPM_PORT__
listen.backlog = 511
pm = static
pm.max_children = __CHILDREN__
request_terminate_timeout = 60s
request_slowlog_timeout = 2s
slowlog = __SCRATCH__/fpm-slow.log
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = __SCRATCH__/php-errors.log
php_admin_value[memory_limit] = 256M
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 1
