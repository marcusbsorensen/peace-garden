; The pool in the PHP container. A fixed number of workers, as a shared host
; gives a site; PGMT_CHILDREN overrides it at `docker run` through the env.
[www]
listen = 9000
listen.backlog = 511
pm = static
pm.max_children = ${PGMT_CHILDREN}
request_terminate_timeout = 60s
request_slowlog_timeout = 2s
slowlog = /proc/self/fd/2
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/pop/php-errors.log
php_admin_value[memory_limit] = 256M
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.revalidate_freq] = 2
