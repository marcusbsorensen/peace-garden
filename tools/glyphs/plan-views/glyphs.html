<!doctype html>
<meta charset="utf-8">
<title>Plan-view glyphs</title>
<style>
  body { margin: 0; background: #0d0d1f; color: #e8e4da; font: 15px/1.4 -apple-system, Helvetica, sans-serif; padding: 24px; }
  h1 { font-weight: 300; font-size: 22px; margin: 0 0 4px; }
  p.note { color: #a9a6b8; margin: 0 0 20px; max-width: 980px; }
  table { border-collapse: collapse; }
  th { font-weight: 400; color: #a9a6b8; text-align: left; padding: 6px 14px 6px 0; font-size: 13px; }
  td { padding: 8px 14px 8px 0; vertical-align: middle; }
  .name { width: 150px; }
  .name b { font-weight: 500; display: block; }
  .name span { color: #a9a6b8; font-size: 12px; }
  .cell { display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; }
  svg { fill: none; stroke: #efe9dc; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .same { color: #6f6c80; font-size: 12px; }
  .sep { border-left: 1px solid #2a2a44; padding-left: 18px; }

<h1>The ten glyphs as plan views</h1>
<p class="note">Left: the glyph today. Right: the plan view drafted for it, at 20, 40 and 96 px on the area's own ground. Monoline, stroke 1.25 on the 20-unit grid, round ends, as gates.js draws them. Three are plans already and are unchanged.</p>
