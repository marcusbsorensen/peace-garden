<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Seedbed</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: rgb(255 255 255 / 0.85);
    font: 15px/1.4 Georgia, serif; }
  main { position: fixed; inset: 0; }
  .pool { position: absolute; inset: 0;
    background: radial-gradient(ellipse 50% 45% at 50% 55%, rgb(255 255 255 / 0.08), transparent 70%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #sky { z-index: -1; }
  #note, #held { position: absolute; inset-inline-start: 16px; margin: 0;
    font: 11px/1.6 system-ui, sans-serif; letter-spacing: 0.06em; color: rgb(255 255 255 / 0.5); }
  #note { inset-block-start: 16px; inset-inline-end: 16px; }
  #held { inset-block-start: 40px; padding: 0; list-style: none; font-variant-numeric: tabular-nums; }
  nav { position: absolute; inset-inline: 16px; inset-block-end: 16px; display: flex; flex-wrap: wrap;
    gap: 8px; justify-content: center; }
  button { background: transparent; color: inherit; border: 1px solid rgb(255 255 255 / 0.4);
    border-radius: 6px; padding: 8px 14px; font: 11px/1 system-ui, sans-serif;
    letter-spacing: 0.14em; text-transform: uppercase; }
  button:disabled { opacity: 0.3; }
</style>
</head>
<body>
<main>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="pool"></div>
  <canvas id="stage" aria-label="A plot of the Seedbed"></canvas>
  <p id="note">Loading…</p>
  <ul id="held"></ul>
  <nav>
    <button id="back" aria-label="The plot before">Back</button>
    <button id="left" aria-label="Turn left">Turn left</button>
    <button id="right" aria-label="Turn right">Turn right</button>
    <button id="on" aria-label="The next plot">On</button>
  </nav>
</main>
<script type="module">
  // The workbench for the sixth area. `?arrivals=500&plot=0` invents a bed of
  // five hundred plants and shows one plot of it, which is how
  // docs/WEB-GARDENS.md says a template is judged: a garden of fourteen hides
  // layout faults.
  //
  // **This area needs two readings rather than one, and the count is why.** Five
  // hundred arrivals fill 65% of the places against the Knot Garden's 92%, so a
  // plot late in the bed is mostly part-sown drills and a plot early in it is
  // mostly full ones. `?arrivals=60` is the sparse reading and `?arrivals=200`
  // the full one, and a drawing that only works at one of them is wrong.
  //
  // **It draws a different five hundred from the test suite's**, and that is the
  // point of it rather than a detail — the Orchard's workbench is what caught a
  // false assertion that both the Swift test and the PHP check agreed on,
  // because all three had only ever looked at the same sample.
  import { loadModule } from '/assets/js/plant.js';
  import { makePlotStage } from '/assets/js/longwalk.js';
  import { describeSeedbed, growInvented, growSeedbedFromService, makeSeedbedGround, plan,
           plantVisitors, readDrills } from '/assets/js/seedbed.js';
  import { makeSky } from '/assets/js/sky.js';

  const query = new URLSearchParams(location.search);
  const number = (name, fallback) => Math.max(0, parseInt(query.get(name) ?? '', 10) || fallback);
  const arrivals = number('arrivals', 500);
  const fromService = query.get('source') === 'service';
  let plot = number('plot', 0);

  const note = document.getElementById('note');
  const held = document.getElementById('held');
  const report = (text) => { note.textContent = text; };
  // **The module, never from the cache.** The live host sends it with a day's
  // max-age, which is right there and wrong on a workbench.
  const MODULE = `/plant.wasm?dev=${Date.now()}`;
  const e = await loadModule(MODULE);
  const place = plan(e);
  // Which drills of the plot on the stage are flooded, as the real page
  // holds it: set before the plot is grown, and the ground dug again for it.
  let flooded = [];
  const stage = makePlotStage(document.getElementById('stage'), 1, e,
                              makeSeedbedGround(place, () => flooded));

  let sky = null;
  makeSky(document.getElementById('sky'), {
    quarterTurns: () => stage.turn(),
    keepClear: () => ['note', 'held'].map((id) => document.getElementById(id))
      .concat([document.querySelector('nav')])
      .filter(Boolean)
      .map((element) => element.getBoundingClientRect())
      .filter((box) => box.width > 0 && box.height > 0),
  }).then((made) => { sky = made; }).catch((trouble) => {
    console.warn('no sky:', trouble);
  });

  const turn = (quarters) => { stage.turnBy(quarters); sky?.draw(); };
  document.getElementById('left').addEventListener('click', () => turn(-1));
  document.getElementById('right').addEventListener('click', () => turn(1));

  let plots = 1;
  if (!fromService) plots = await plantVisitors(e, arrivals, report);

  // What the rule did with this plot, in words: which kind claimed each drill
  // and how far along it is sown. **The thing to watch is that a drill holds one
  // kind and no other** — six rows of one epithet apiece. The second thing is
  // the shape of the numbers: a bed where every drill stands at 8 is a bed of
  // common kinds only, and a bed where every drill stands at 1 is a rule that is
  // claiming a drill for a plant that will never be joined.
  function say() {
    held.replaceChildren();
    if (fromService) return;
    const rows = describeSeedbed(e, plot);
    const drills = readDrills(place,
      rows.map((r) => ({ drill: r.slot.drill, kind: r.traits.kind, span: r.span })));
    for (const drill of drills) {
      const line = document.createElement('li');
      line.textContent = drill.kind
        ? `drill ${drill.drill + 1}: ${drill.kind} — ${drill.sown} of ${place.places}`
        : `drill ${drill.drill + 1}: unsown`;
      held.append(line);
    }
  }

  async function show() {
    document.getElementById('back').disabled = plot === 0;
    document.getElementById('on').disabled = plot + 1 >= plots;
    if (!fromService) {
      flooded = [...new Set(describeSeedbed(e, plot)
        .filter((r) => r.traits.habit === 'lotus')
        .map((r) => r.slot.drill))].sort((a, b) => a - b);
      stage.rebuild();
    }
    const count = fromService
      ? (await growSeedbedFromService(e, stage, plot, report,
                                      (water) => { flooded = water; })).length
      : await growInvented(e, stage, plot, report);
    report(`Plot ${plot + 1} of ${plots} — ${count} of ${place.slots}`);
    say();
    sky?.draw();
  }

  document.getElementById('back').addEventListener('click', () => { plot = Math.max(0, plot - 1); show(); });
  document.getElementById('on').addEventListener('click', () => { plot = Math.min(plots - 1, plot + 1); show(); });
  await show();
</script>
</body>
</html>
