<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wild Fields</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: rgb(255 255 255 / 0.85);
    font: 15px/1.4 Georgia, serif; }
  main { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #sky { z-index: -1; }
  #flies { pointer-events: none; }
  #note { position: absolute; inset-inline: 16px; inset-block-start: 16px; margin: 0;
    font: 11px/1.6 system-ui, sans-serif; letter-spacing: 0.06em; color: rgb(255 255 255 / 0.5); }
  nav { position: absolute; inset-inline: 16px; inset-block-end: 16px; display: flex; flex-wrap: wrap;
    gap: 8px; justify-content: center; }
  button { background: transparent; color: inherit; border: 1px solid rgb(255 255 255 / 0.4);
    border-radius: 6px; padding: 8px 14px; font: 11px/1 system-ui, sans-serif;
    letter-spacing: 0.14em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <canvas id="sky" aria-hidden="true"></canvas>
  <canvas id="stage" aria-label="An invented Wild Fields"></canvas>
  <canvas id="flies" aria-hidden="true"></canvas>
  <p id="note">Loading…</p>
  <nav>
    <button id="left" aria-label="Turn left">Turn left</button>
    <button id="right" aria-label="Turn right">Turn right</button>
    <button id="out" aria-label="Further">Further</button>
    <button id="in" aria-label="Closer">Closer</button>
  </nav>
</main>
<script type="module">
  // The workbench for the Wild Fields. `?plants=400` invents a field of that
  // many released plants — minted seeds, standing where SeedCore's rule puts
  // each — so the field can be judged at a thousand before anybody has let
  // one go. `?source=service` draws what the local plot service holds
  // instead. Drag to walk, as on the page.
  //
  // The invented plants are minted, not crossed: a field of them is the
  // field's density and its night, which is what this is for, and not anybody's
  // plants.
  //
  // **Water under a lotus, a prototype (2 October 2026)**: `?water=a|b|c`
  // draws one of three answers (`wildwater.js`); without it the field is the
  // page's. `?lotus=x,z;x,z` adds a water lily at each of those points of the
  // field — a seed minted until it is a lotus, with its first four bytes set
  // to stand there, so it still stands where its seed puts it — and
  // `?at=x,z`, `?zoom=` and `?turn=` set where and how close the window opens.
  import { loadModule, decode, takeResult } from '/assets/js/plant.js';
  import { makeSky } from '/assets/js/sky.js';
  import { SIDE, TILES, flyOver, makeWildStage, spotOf } from '/assets/js/wildfields.js';
  import { LOTUS_HEADS, makeWildWater } from '/assets/js/wildwater.js';

  const query = new URLSearchParams(location.search);
  const count = Math.max(0, parseInt(query.get('plants') ?? '', 10) || 400);
  const fromService = query.get('source') === 'service';
  const kind = ['a', 'b', 'c'].includes(query.get('water')) ? query.get('water') : null;
  const points = (text) => (text ?? '').split(';').map((p) => p.split(',').map(Number))
    .filter((p) => p.length === 2 && p.every(Number.isFinite));
  const note = document.getElementById('note');

  const hex = (bytes) => [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');
  const digest = async (text) => new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)));

  // The module, never from the cache: see `/dev/quiet`.
  const e = await loadModule(`/plant.wasm?dev=${Date.now()}`);

  function nameOf(seed) {
    const words = new TextEncoder().encode(seed);
    const pointer = e.pg_alloc(words.length);
    new Uint8Array(e.memory.buffer, pointer, words.length).set(words);
    const length = e.pg_name(pointer, words.length);
    e.pg_free(pointer);
    return length ? JSON.parse(new TextDecoder().decode(takeResult(e, length))) : null;
  }
  const isLotus = (seed) => LOTUS_HEADS.has(nameOf(seed)?.head);

  // How far a plant's leaves lie from its stem, from the grown mesh's bounds.
  function reachOf(seed) {
    const words = new TextEncoder().encode(seed);
    const pointer = e.pg_alloc(words.length);
    new Uint8Array(e.memory.buffer, pointer, words.length).set(words);
    const length = e.pg_grow(pointer, words.length);
    e.pg_free(pointer);
    const shape = decode(takeResult(e, length));
    return Math.max(0.05, ...[0, 2].flatMap((i) => [Math.abs(shape.min[i]), Math.abs(shape.max[i])]));
  }

  // A lotus standing at `[x, z]`: the place is the seed's first four bytes,
  // so those are set and the rest minted until the seed is a water lily.
  async function lotusAt([x, z], n) {
    const across = Math.max(0, Math.min(65535, Math.round((x / SIDE) * 65536 - 0.5)));
    const along = Math.max(0, Math.min(65535, Math.round((z / SIDE) * 65536 - 0.5)));
    for (let k = 0; k < 4000; k++) {
      const bytes = await digest(`wild lotus ${n} ${k}`);
      bytes[0] = across >> 8; bytes[1] = across & 255; bytes[2] = along >> 8; bytes[3] = along & 255;
      const seed = hex(bytes);
      if (isLotus(seed)) return { seed, parents: [], spot: spotOf(seed) };
    }
    throw new Error(`no lotus found for ${x}, ${z}`);
  }

  async function invent(n) {
    const plants = [];
    for (let i = 0; i < n; i++) {
      const seed = hex(await digest(`wild bench ${i}`));
      plants.push({ seed, parents: [], spot: spotOf(seed) });
    }
    const asked = points(query.get('lotus'));
    for (let i = 0; i < asked.length; i++) plants.push(await lotusAt(asked[i], i));
    const tiles = new Map();
    for (const p of plants) {
      const key = `${Math.floor(p.spot[0] / (SIDE / TILES))},${Math.floor(p.spot[1] / (SIDE / TILES))}`;
      if (!tiles.has(key)) tiles.set(key, []);
      tiles.get(key).push(p);
    }
    return { tiles, plants };
  }

  const invented = fromService ? null : await invent(count);
  const source = fromService
    ? async (x, z) => (await (await fetch(`/api/wild/tile/${x}/${z}`)).json()).plantings
    : async (x, z) => invented.tiles.get(`${x},${z}`) ?? [];
  const lotuses = kind && invented
    ? invented.plants.filter((p) => isLotus(p.seed)).map((p) => ({ seed: p.seed, spot: p.spot, reach: reachOf(p.seed) }))
    : [];
  const water = kind ? makeWildWater(kind, lotuses) : null;
  const [at] = points(query.get('at'));
  const stage = makeWildStage(document.getElementById('stage'), e, {
    source,
    water,
    ...(at ? { from: at } : {}),
    report: (growing) => { note.textContent = growing ? 'Growing…'
      : `${fromService ? 'The local service' : `${count} invented plants`}`
        + `${kind ? ` · water ${kind}, ${lotuses.length} lotuses` : ''} · drag to walk`; },
  });
  flyOver(document.getElementById('flies'), stage);
  let sky = null;
  makeSky(document.getElementById('sky'), { milkyWay: true, quarterTurns: () => stage.turn() })
    .then((made) => { sky = made; });

  // Set the opening look, then say when everything in it has grown.
  (async () => {
    await stage.settled();
    const quarters = parseInt(query.get('turn') ?? '', 10);
    if (quarters) { stage.turnBy(quarters); sky?.draw(); }
    const zoom = parseFloat(query.get('zoom') ?? '');
    if (zoom > 1) stage.lookAt({ zoom });
    await new Promise((go) => setTimeout(go, 50));
    await stage.settled();
    document.body.dataset.ready = '1';
  })();
  window.wild = { stage, water, lotuses };

  const canvas = document.getElementById('stage');
  let held = null;
  canvas.addEventListener('pointerdown', (event) => { held = [event.clientX, event.clientY]; canvas.setPointerCapture(event.pointerId); });
  canvas.addEventListener('pointermove', (event) => {
    if (!held) return;
    const m = stage.view().metresPerPixel;
    const v = stage.view();
    stage.lookAt({ x: v.x - (event.clientX - held[0]) * m, y: v.y + (event.clientY - held[1]) * m });
    held = [event.clientX, event.clientY];
  });
  canvas.addEventListener('pointerup', () => { held = null; });
  const turn = (q) => { stage.turnBy(q); sky?.draw(); };
  document.getElementById('left').onclick = () => turn(-1);
  document.getElementById('right').onclick = () => turn(1);
  document.getElementById('in').onclick = () => stage.lookAt({ zoom: stage.view().zoom * Math.SQRT2 });
  document.getElementById('out').onclick = () => stage.lookAt({ zoom: stage.view().zoom / Math.SQRT2 });
</script>
</body>
</html>
