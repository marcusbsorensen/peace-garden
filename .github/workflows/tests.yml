name: Tests

# The parts that must not drift are the derivation and the geometry, and they
# are exactly the parts that need no device to test. Everything above them —
# SwiftUI, SceneKit — needs Xcode on a Mac and is not run here.
#
# **So `App/PeaceGardenTests` is run by hand**, and the day an area opens is
# when to remember: opening the Quiet Garden on 21 September left
# `ThemeMappingTests` asserting that travel was the only one, and nothing said
# so for a commit and a deploy.
#
#   xcodebuild test -project PeaceGarden.xcodeproj -scheme PeaceGarden \
#     -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seedcore:
    name: SeedCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/SeedCore/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Packages/SeedCore/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build
        run: swift build --package-path Packages/SeedCore

      - name: Test
        run: swift test --package-path Packages/SeedCore

  # The browser grows plants with SeedCore compiled to WebAssembly, where `Int`
  # is 32 bits and only FoundationEssentials is linked. Either can break the
  # build or change a plant without touching the other two hosts, so the suite
  # runs inside wasm too. docs/WEBSITE.md §What renders the plant.
  #
  # **This job and the Linux one can be run on the Mac**, which is how the
  # libm divergence of 22 September was found without pushing and waiting:
  #   swift build --package-path Packages/SeedCore --build-tests \
  #     --swift-sdk swift-6.3.3-RELEASE_wasm --scratch-path .build-wasm
  #   node tools/wasm/run-wasi.mjs .build-wasm/debug/SeedCorePackageTests.xctest
  # It takes ten minutes and it is the only way to see what another host sees.
  seedcore-wasm:
    name: SeedCore (WebAssembly)
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install the WebAssembly SDK
        run: >
          swift sdk install
          https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz
          --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7

      - name: Build the tests
        run: swift build --package-path Packages/SeedCore --build-tests --swift-sdk swift-6.3.3-RELEASE_wasm --scratch-path .build-wasm

      - name: Test inside WebAssembly
        run: node tools/wasm/run-wasi.mjs .build-wasm/debug/SeedCorePackageTests.xctest

      - name: Build the browser module
        run: |
          swift build --package-path tools/wasm -c release --swift-sdk swift-6.3.3-RELEASE_wasm -Xswiftc -Osize
          echo "PlantWasm.wasm, unoptimised: $(wc -c < tools/wasm/.build/release/PlantWasm.wasm) bytes" >> "$GITHUB_STEP_SUMMARY"

  derivation-reference:
    name: Derivation reference (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # For the sky port, which is the one check in this job that is neither
      # Python nor PHP.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The reference asserts its own invariants — that a cross is commutative
      # and that distinct encounters give distinct children — and prints the
      # vectors pinned into DerivationVectorTests. If the two implementations
      # ever disagree, one job goes red and the other stays green, which says
      # which one moved.
      - name: Run the reference implementation
        run: python3 tools/reference/derivation_reference.py

      # Quotes lives in App/, which has no test target, so the Swift suite never
      # reaches the passage draw. This reads the themes and the bank straight out
      # of Quotes.swift and checks the rules hold — that no theme is empty or
      # unreachable, that a pair's theme does not move between meetings, and that
      # every passage can actually come up.
      - name: Check the passage draw
        run: python3 tools/reference/passage_reference.py

      # The site's banks and its language list are generated from the app, so a
      # bank added to the app is a bank the site has, in the same commit. Without
      # this the site is behind by however long it takes somebody to remember —
      # which is the failure tools/preview/ already has and the string catalogue
      # already had. docs/WEBSITE.md argues it at length.
      - name: The site's languages are the app's
        run: python3 tools/site/export.py --check

      # tools/preview/plant_model.py is a hand-maintained port of SeedCore, and
      # it is how the garden gets looked at — every defect this repository has
      # caught by eye was caught in a Python render. It had drifted three times
      # before this step existed, so a render could be of a plant the app does
      # not grow. tools/preview/vectors.json is committed; the SeedCore job's
      # PortVectorTests says the file is what the Swift computes and this says
      # it is what the port computes. Both have to pass for the two to be the
      # same garden. It needs no numpy — see tools/preview/README.md.
      - name: The preview port is SeedCore
        run: python3 tools/preview/check_port.py
      # The plot service places Long Walk arrivals in PHP, a port of
      # SeedCore's LongWalk. LongWalkVectorTests holds the pinned placements
      # to the Swift; this holds the PHP to them. The runner has PHP already.
      - name: The plot service's rule is SeedCore's
        run: php tools/reference/check_long_walk.php
      # And the two agree about which areas exist and which are open. The day
      # an area opens, one of them learns it first; without this the other goes
      # on refusing plants for a week and nothing logs a thing.
      - name: The service's garden is SeedCore's garden
        run: php tools/reference/check_areas.php
      # And about the ten plants that stand for the ten areas. The service
      # cannot grow one to find out how tall it is, so it holds the height and
      # the colour family as constants — and a constant copied out of another
      # program is the thing that drifts. This also derives the travel
      # ambassador's slot on both sides rather than pinning it twice.
      - name: The ambassadors are SeedCore's ambassadors
        run: php tools/reference/check_ambassador.php
      # The second area's rule, which is the one that returns the first slot it
      # finds rather than the best-scoring one — so a port that agreed about
      # every number and disagreed about which corner to look at first would
      # diverge silently after the first few dozen plants.
      - name: The Quiet Garden's rule is SeedCore's
        run: php tools/reference/check_quiet_garden.php
      # The third area's, which breaks a tie between two equally empty quarters
      # on the lower-numbered one. A port that took `<=` where this takes `<`
      # would agree about every number and still file every plant differently.
      - name: The Crossing's rule is SeedCore's
        run: php tools/reference/check_crossing.php

      - name: The Orchard's rule is SeedCore's
        run: php tools/reference/check_orchard.php

      # The fifth area's, and the first whose answer turns on a plant's colour
      # rather than only its height. A port that read the colour but claimed
      # pairs in a different order agrees about the whole of plot 0 and
      # diverges a long way in, when a colour first runs out of room in the
      # plot it started in.
      - name: The Knot Garden's rule is SeedCore's
        run: php tools/reference/check_knot.php

      # The sixth area's, and the first that groups by sameness: a drill is
      # claimed by the kind of the first plant sown in it. A port that claimed
      # drills in a different order, or that let a kind claim a second drill in
      # a plot where its first is full, agrees about the whole of plot 0 and
      # diverges only when a common kind first fills eight places.
      - name: The Seedbed's rule is SeedCore's
        run: php tools/reference/check_seedbed.php

      # The seventh area's, which claims a frame by colour as the Knot Garden
      # claims a pair, and then tries a plant's own rank before the other one.
      # A port that tried every frame's own rank before any frame's other rank
      # agrees for the first two hundred arrivals and diverges in plot 4, the
      # first time a rank is out of room while another frame of that colour
      # still has some.
      - name: The Cold Frame's rule is SeedCore's
        run: php tools/reference/check_cold_frame.php

      # The eighth area's, the first that reads a hue: a pot tries its own band
      # in every plot before a neighbour in any, and the neighbour its hue leans
      # to before the other. A port that tried each plot's neighbours before
      # the next plot's own band parts company at arrival 26; one that always
      # tried the lower neighbour first, at arrival 103.
      - name: The Glasshouse's rule is SeedCore's
        run: php tools/reference/check_glasshouse.php

      # The ninth area's, the first that reads a habit: a fern takes a stool,
      # then the floor at one fern a coupe, then a new plot; a star takes its
      # own row of the floor, then the other if the rows stay in order.
      - name: The Coppice's rule is SeedCore's
        run: php tools/reference/check_coppice.php

      # The tenth's, the last: the crop, read off the habit, claims a bed; a
      # plant takes the north end from its crop's cut up and the south below.
      - name: The Home Ground's rule is SeedCore's
        run: php tools/reference/check_home_ground.php
      # And the asking above it: nothing reaches the walk until the second
      # gardener has said yes, and only the token an offer was addressed to
      # can say it. The walk itself has no way to tell, so this is where it
      # is held.
      - name: Nothing is planted unasked
        run: php tools/reference/check_offers.php
      # And the Wild Fields, which have no asking: a released plant stands
      # where SeedCore's WildFields says its seed puts it, the field keeps the
      # plant and nothing about who let it go, and a plant that has stood in
      # an area is released only by one of the two who grew it — and is then
      # offered to no area again.
      - name: A released plant stands where its seed says, and nowhere else
        run: php tools/reference/check_wild_fields.php
      # And the paths visitors wear in them (2 October 2026, on /dev only): a
      # number per ground cell that halves in a month, counts each cell
      # once a batch and a few times a day at most, keeps nothing about who
      # walked — and is not there at all on a copy that has not turned it on,
      # which is every copy but a local one.
      - name: Paths are worn by many, fade, and keep nothing about anybody
        run: php tools/reference/check_wild_wear.php
      # And one caller cannot fill the walk. The interesting half is that the
      # allowance comes back: a limit that counted for ever would lock somebody
      # out of their own garden by the second week and nothing would say so.
      - name: One caller cannot fill the walk
        run: php tools/reference/check_limits.php
      # And the five-minute clean-up cron runs, for the quiet spells when no request
      # comes to do it: an ended window and a thirty-day offer go, nothing else
      # does, and two runs at once, or a run beside a request, erase nothing
      # twice. What the privacy page says about an hour and thirty days rests
      # on it.
      - name: The sweep clears what has ended
        run: php tools/reference/check_sweep.php
      # The nightly copy of the walk. What is checked here is the part that
      # runs with nobody watching: a dump cut short is a valid gzip of a valid
      # beginning and restores most of the walk in silence, so the copy is read
      # back before it is filed. Restoring one for real wants a MariaDB and
      # lives in tools/backup.sh --restore-test.
      - name: A copy of the walk is a copy of the walk
        run: php tools/reference/check_backup.php
      # The web walk draws the same sky as the app, in JavaScript, because a
      # browser cannot run SeedCore. SkyVectorTests writes down what the Swift
      # sees; this holds the port to it — including a field of eight thousand
      # real stars, which is the only place a catalogue decoded half a byte out
      # or a sky drawn upside down actually shows.
      - name: The browser's sky is SeedCore's sky
        run: node tools/reference/check_sky.mjs
      - name: The site's own prose is commissioned, not drifting
        run: python3 tools/strings/check.py
      # The numeral rule, which nothing enforced until 6 September and which
      # had shipped *1 grown from a meeting* in eight languages by then. It
      # reads the app's catalogue rather than the site's: the site's
      # forty-two carry no numerals at all.
      - name: One stays a word in the app
        run: python3 tools/strings/app_check.py
